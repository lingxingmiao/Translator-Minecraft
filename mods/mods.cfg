PqM=16
#PQ 每子量化位数
Nbits=8

#mod:index-nsgflat
#NSG 图出度
R=64
#建图搜索路径长度 (建议 L>R)
L=144
#建图候选池大小 (建议 C>L>R)
C=212
#检索束宽 (建议>=R)
SearchL=240

#mod:index-nsgsq
#标量量化格式 Q4 Q6 Q8 F16 BF16
Quant="Q8"
#NSG 图出度
R=64
#建图搜索路径长度 (建议 L>R)
L=144
#建图候选池大小 (建议 C>L>R)
C=212
#检索束宽 (建议>=R)
SearchL=240

#mod:index-nsgpq
#NSG 图出度
R=64
#建图搜索路径长度 (建议 L>R)
L=144
#建图候选池大小 (建议 C>L>R)
C=212
#检索束宽 (建议>=R)
SearchL=240
#PQ 子量化器数
PqM=16
#PQ 每子量化位数
Nbits=8

#mod:index-ivf
#聚类数比例倒数: nprobe = min(nlist, nlist / 该值)
Nlist=0.25

#mod:index-ivfsq
#标量量化格式 Q4 Q6 Q8 F16 BF16
Quant="Q8"
#聚类数比例倒数: nprobe = min(nlist, nlist / 该值)
Nlist=0.25
#是否对残差编码
ByResidual=true

#mod:index-ivfpq
#聚类数比例倒数: nprobe = min(nlist, nlist / 该值)
Nlist=0.25
#PQ 子量化器数
PqM=16
#PQ 每子量化位数
Nbits=8

#mod:index-ivfpqr
#聚类数比例倒数: nprobe = min(nlist, nlist / 该值)
Nlist=0.25
#PQ 子量化器数
PqM=16
#PQ 每子量化位数
Nbits=8
#精修级 PQ 子量化器数
MRefine=16
#精修级每子量化位数
NbitsRefine=8

#mod:index-refine
#降维模式 null/pca/mrl (Refine 仅支持 pca)
LowDimMode=null
#粗排维度
LowDimDim=64
#粗排召回倍数
KFactor=10.0

#mod:index-refinelowdim
#降维模式 null/pca/mrl
LowDimMode="mrl"
#粗排维度
LowDimDim=64
#粗排召回倍数
KFactor=10.0

#mod:index-gsq
#GSQ 系列索引共用段 (GSQMoE 路由版 / GSQFast 全量扫描版)
#IndexGSQ 量化格式 GSQ2 GSQ3 GSQ4 GSQ5 GSQ6 GSQ8
Quant="GSQ2"
#聚类数系数: nlist = 该值 * sqrt(N), 上限 N//8 (越大路由越细, 但每 cell 尾块会放大元数据)
Nlist=4.0
#检索探测 cell 数 (39 约合全库 1.8% 扫描, 路由召回约 82%)
Nprobe=39
#每块查询数: 激活面按块取并集, 块越大并集越接近全库, 加速会被吃掉
QueryBlock=64
#低于此向量数直接全量扫描
MinVectors=50000
#是否沿用 INDEX_GSQ_PCA_DIM 降维
UsePCA=true

#PcaDim
PcaDim=-1
#BlockSize
BlockSize=128
#RerankBlockSize
RerankBlockSize=128
#ItrsLM
ItrsLM=200
#SplLM
SplLM=0.05
#EsLM
EsLM=1e-06

#mod:quant-gsq_nl
#BlockSize
BlockSize=128
#SplLM
SplLM=0.05

#mod:quant-opq
#PqM
PqM=128
#PqNbits
PqNbits=8
#OpqItrs
OpqItrs=25

#mod:quant-polar
#BlockSize
BlockSize=128
#SplLM
SplLM=0.05

#mod:quant-pq
#PqM
PqM=128
#PqNbits
PqNbits=8

#mod:quant-q2_nf
